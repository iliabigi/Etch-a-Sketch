<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Drawing page</title>
        <script defer src="./script.js"></script>
        <link href="./styles.css" rel="stylesheet" />
    </head>

    <body>
        <div class="header">
            <h1>WELCOME TO ETCH A SCATCH!</h1>
        </div>

        <div class="drawMode">
            <div class="txt">
                <p>Pick a mode:</p>
            </div>
            <div class="buttons1">
                <button type="button">hover</button>
                <button type="button">click</button>
            </div>
        </div>

        <div class="chooseColor">
            <div class="txt">
                <p>Pick a color:</p>
            </div>
            <div class="buttons1">
                <button type="button" id="purple">purple</button>
                <button type="button" id="aqua">aqua</button>
                <button type="button" id="black">black</button>
                <button type="button" id="rainbow">rainbow</button>
            </div>
        </div>

        <div class="resetIt buttons1">
            <button type="button" id="reset">Reset</button>
        </div>

        <div class="container"></div>
    </body>
</html>
